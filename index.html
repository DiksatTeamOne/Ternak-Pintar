/* Jam bersama: satu hari permainan = CYC detik, dihitung dari jam server Firebase (atau jam perangkat bila mode sendiri).

const clockOk=()=>window.TP_OFF!==undefined||!window.claude||performance.now()>8000;
function tickJam(dt){
  if(!S)return;
  const ok=clockOk();
  if(ok){
    const st=wolfTime(),cy=Math.floor(st/CYC);
    if(S.cyc==null)S.cyc=cy;
    else if(S.cyc!==cy&&!RESETAT){resetDay();return}

  else if(hr>lastHr){lastHr=hr;toast(JM_MSG[hr]);stats();pushProfile()}
  if(clk-lastSave>8){lastSave=clk;save()}
  if(ok&&jm>=JM_MAX&&!RESETAT){if(!$("modal").hidden)closeModal();S.end=1;save();finishGame()}}

  if(!first){$("xTop").onclick=$("batal").onclick=closeModal;arm($("reset"),()=>{S={...newGame(S.nama),c:S.c,ac:S.ac};save();closeModal();toLobby();toast("Permainan dimulai dari awal.")})}
  $("masuk").onclick=()=>{
    const n=$("nama").value.trim();if(!n){$("nama").focus();$("nama").placeholder="Isi namamu dulu";return}
    const c=+document.querySelector("input[name=wc]:checked").value,a=+document.querySelector("input[name=wa]:checked").value,k=cleanKelas($("kelas").value)||"kelas",kc=k!==KELAS;
    KELAS=k;try{localStorage.setItem(CKEY,KELAS)}catch(e){}
    if(first){const sv=load();S=sv&&pid(sv.nama)===pid(n)?sv:newGame(n)}
    const nameChanged=pid(S.nama)!==pid(n)&&!first;S.nama=n;S.c=c;S.ac=a;S.det=S.det||[];S.waktu=S.waktu||0;S.jm=num(S.jm,0,JM_MAX);save();
    if(first){enterGame();return}
    closeModal();stats();pushProfile();if(kc){joinRoom(KELAS);DIRTY=true}if(nameChanged||kc)recordRank(true)};
  $("nama").focus()}
function openHelp(){stopAudio();$("panel").dataset.k="help";
  $("panel").innerHTML=`<button class="x" id="xTop" aria-label="Tutup">X</button><h2 id="cTitle">Cara bermain</h2><ol class="how"><li>Isi nama dan kode kelas, lalu masuk lobi. Teman dengan kode yang sama ikut terlihat.</li><li>Jalan dengan panah atau WASD, atau sentuh dan tahan layar. Tekan E untuk aksi.</li><li>Dengarkan bahan simakan di papan 📻 AUDIO di lobi. Di peta tidak ada audio, kamu hanya menjawab tugas.</li><li>Masuk gerbang di lobi untuk ke peta, lalu datangi papan pakan yang berkedip.</li><li>Waktu berjalan dari pukul 17.00 (sore) sampai 20.50 (malam), lalu permainan berakhir. Jam ini sama untuk semua pemain di kelas dan terus berjalan walau kamu sedang mengerjakan tugas, lalu hari baru dimulai bersamaan. Langit, cahaya, dan suasana peta ikut berubah, jadi cari lentera dan papan yang bersinar.</li><li>Pukul 20.00 lima pemain dipilih sekali saja menjadi serigala. Serigala gugur: tidak bisa mengerjakan tugas atau mendapat poin, tugasnya memangsa. Pemain yang termangsa mati, levelnya berkurang satu, dan kembali ke lobi. Lobi aman.</li><li>Rumah, lumbung, silo, dan kandang di peta adalah rumah aman: pemain boleh masuk (tekan E di pintunya, maksimal 20 detik) tetapi serigala tidak boleh.</li><li>Susun langkah dengan menyeret atau tombol ▲▼, lalu jawab soal tambahan jika ada.</li><li>Benar: dapat poin dan hewanmu naik level. Peringkat kelas selalu terlihat di kanan atas.</li></ol>
    <h2>Jalur evolusi</h2><ul class="road">${AV.map((a,i)=>`<li>${spr(a.e,40)}<small>Lv ${i+1}</small><b>${a.n}</b></li>`).join("")}</ul>
    <button class="btn" id="okH">Mengerti</button>`;
  openModal();$("xTop").onclick=$("okH").onclick=closeModal;$("okH").focus()}
function openRank(tab="papan"){
  stopAudio();$("panel").dataset.k="rank";
  const r=rows(),mi=r.findIndex(x=>x.me);let body;
  if(tab==="histori"){body=histBody()}else if(tab==="papan"){
    const row=(x,i)=>`<tr class="${x.me?"mine":""}"><td class="n">${i<3?spr(["🥇","🥈","🥉"][i],22):i+1}</td><td><span class="dot${x.on?" on":""}"></span>${esc(x.n)}</td><td>${x.l}/5</td><td class="n">${x.s}</td><td class="n">${fmt(x.w)}</td></tr>`;
    let rows_=r.slice(0,15).map(row).join("");if(mi>=15)rows_+=`<tr><td colspan="5" class="center">…</td></tr>`+row(r[mi],mi);
    const notes=[DBWERR?"Skormu belum tersimpan di peringkat kelas karena aksesmu hanya melihat. Minta guru mengubah aksesmu menjadi Kontributor.":"",DBSLOW?"Peringkat tersimpan belum bisa dimuat. Pemain yang sedang online tetap terlihat.":"",!RM&&!DB?"Mode sendiri: peringkat hanya berisi pemain di perangkat ini.":""].filter(Boolean);
    body=`<p class="lead">Urutan berdasarkan skor, lalu waktu tercepat. Titik hijau berarti sedang online.</p><div class="tbw"><table class="tb"><thead><tr><th class="n">#</th><th>Nama</th><th>Level</th><th class="n">Skor</th><th class="n">Waktu</th></tr></thead><tbody>${rows_}</tbody></table></div>${notes.map(n=>`<p class="note">${esc(n)}</p>`).join("")}`;
  }else if(!S){body=`<p class="lead">Mulai bermain dulu untuk melihat hasilmu.</p>`}
  else{
    const d=S.det||[];
    const rs=LV.map((L,i)=>{const x=d[i];return x?`<tr><td>${i+1}</td><td>${esc(L.t)}</td><td class="n">${x.p}</td><td class="n">${x.s}</td><td class="n">${fmt(x.w)}</td></tr>`:`<tr><td>${i+1}</td><td>${esc(L.t)}</td><td class="n" colspan="3">Belum selesai</td></tr>`}).join("");
    body=`<p class="lead"><b>${esc(S.nama)}</b> · Skor <b>${S.skor}</b> · Waktu ${fmt(S.waktu)}${mi>=0?" · Peringkat #"+(mi+1):""}</p><div class="tbw"><table class="tb"><thead><tr><th>Lv</th><th>Tantangan</th><th class="n">Poin</th><th class="n">Salah</th><th class="n">Waktu</th></tr></thead><tbody>${rs}</tbody></table></div>`}
  $("panel").innerHTML=`<button class="x" id="xTop" aria-label="Tutup">X</button><h2 id="cTitle">Peringkat &amp; Hasil</h2>
    <div class="tabs" role="tablist"><button role="tab" id="tP" aria-selected="${tab==="papan"}">Papan peringkat</button><button role="tab" id="tH" aria-selected="${tab==="hasil"}">Hasilku</button><button role="tab" id="tR" aria-selected="${tab==="histori"}">Histori</button></div>
    ${body}
    <div class="rk"><button class="btn" id="okR">Tutup</button><button class="btn alt" id="csv" ${r.length&&tab!=="histori"?"":"hidden"}>Unduh CSV</button></div>`;
  openModal();$("xTop").onclick=$("okR").onclick=closeModal;
  $("tP").onclick=()=>openRank("papan");$("tH").onclick=()=>openRank("hasil");$("tR").onclick=()=>{HSEL=0;openRank("histori")};$("csv").onclick=csvDl;if(tab==="histori")histWire();
  $(tab==="papan"?"tP":tab==="histori"?"tR":"tH").focus()}
async function csvDl(){
  const r=rows(),q=v=>{let s=String(v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const head=["Peringkat","Nama","Kelas","Level selesai","Skor","Waktu (detik)",...LV.flatMap((_,i)=>["L"+(i+1)+" poin","L"+(i+1)+" salah","L"+(i+1)+" detik"])];
  const data=r.map((x,i)=>[i+1,x.n,KELAS,x.l,x.s,x.w,...LV.flatMap((_,j)=>{const d=(x.det||[])[j];return d?[d.p,d.s,d.w]:["","",""]})]);
  const csv="﻿"+[head,...data].map(a=>a.map(q).join(",")).join("\r\n"),fn="peringkat-ternak-pintar-"+KELAS+".csv";
  if(DL){try{await DL.save({filename:fn,data:csv});toast("Berkas CSV disimpan.");return}catch(e){if(e&&e.code==="declined")return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function winModal(){stopAudio();$("panel").dataset.k="win";
  $("panel").innerHTML=`<div class="center"><div class="big">${spr("🐄👑",80)}</div><h2 id="cTitle" style="padding:0">Kamu Raja Ternak!</h2>
    <p class="lead" style="margin:0 auto">Kelima tantangan selesai. Kamu menyimak, mengurutkan, dan menganalisis teks prosedur sampai tuntas.</p>
    <div class="big">${sp("🏅",72)}</div><p><b>Lencana Emas</b> untuk ${esc(S.nama)} · Skor akhir <b>${S.skor}</b></p>
    <div class="rk" style="justify-content:center"><button class="btn" id="wRank">Lihat peringkat</button><button class="btn alt" id="wMap">Jelajahi peta</button></div></div>`;
  openModal();$("wRank").onclick=()=>openRank();$("wMap").onclick=()=>{closeModal();toMap()};$("wRank").focus()}

/* ---------- Audio ---------- */
function stopAudio(){if("speechSynthesis" in window)speechSynthesis.cancel()}
let C=null;
function playAudio(L){
  const st=$("aSt");
  if(!("speechSynthesis" in window)){st.textContent="Browser ini tidak mendukung suara. Gunakan Chrome.";return}
  stopAudio();if(C)C.plays++;
  const u=new SpeechSynthesisUtterance(L.audio);u.lang="id-ID";u.rate=L.rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("id"));if(v)u.voice=v;
  u.onstart=()=>st.textContent="Memutar audio…";
  u.onend=()=>st.textContent="Audio selesai. Putar lagi kapan saja.";
  u.onerror=()=>st.textContent="Audio tidak dapat diputar.";
  speechSynthesis.speak(u)}

/* ---------- Tantangan ---------- */
function shuffle(n){let a;do{a=[...Array(n).keys()].sort(()=>Math.random()-.5)}while(a.every((v,i)=>v===i));return a}
function openChallenge(){save();
  const L=LV[S.lv-1];C={order:shuffle(L.steps.length),salah:0,plays:0,t0:Date.now()};
  let q="";
  if(L.q){const multi=L.q.a.length>1;
    q=`<fieldset class="q"><legend>${L.q.t}</legend>${L.q.o.map((o,i)=>`<label><input type="${multi?"checkbox":"radio"}" name="qq" value="${i}"> ${o}</label>`).join("")}</fieldset>`}
  $("panel").innerHTML=`
    <button class="x" id="xTop" aria-label="Tutup">X</button>
    <h2 id="cTitle">${spr(AV[S.lv-1].e,32)} Level ${S.lv}: ${L.t}</h2>
    <p class="goal">${L.misi}</p>
    <p class="note">Audio level ini diputar di lobi (papan 📻 AUDIO). Di sini kamu hanya menyusun langkah dan menjawab pertanyaan.</p>
    <p><b>Susun langkah</b> dengan menyeret atau tombol ▲▼.</p>
    <ul class="steps" id="steps"></ul>${q}
    <div class="fb" id="fb" role="status" hidden></div>
    <button class="btn" id="cek">Periksa jawaban</button>
    <button class="btn alt" id="tutup">Kembali ke peta</button>`;
  openModal();INCH=true;pushProfile();
  $("panel").dataset.k="ch";$("xTop").onclick=closeCh;  $("cek").onclick=()=>cek(L);$("tutup").onclick=closeCh;
  drawSteps(L)}
function closeCh(){closeModal();S.done?winModal():toMap()}
function drawSteps(L){
  const ul=$("steps");
  ul.innerHTML=C.order.map((si,p)=>`<li draggable="true" data-p="${p}"><span class="tx">${L.steps[si]}</span><span class="mv"><button data-m="-1" aria-label="Naikkan">▲</button><button data-m="1" aria-label="Turunkan">▼</button></span></li>`).join("");
  ul.querySelectorAll("li").forEach(li=>{
    const p=+li.dataset.p;
    li.querySelectorAll("button").forEach(b=>b.onclick=()=>swap(L,p,p+ +b.dataset.m));
    li.ondragstart=e=>{e.dataTransfer.setData("text/plain",p);li.classList.add("drag")};
    li.ondragend=()=>li.classList.remove("drag");
    li.ondragover=e=>e.preventDefault();
    li.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData("text/plain");const [it]=C.order.splice(f,1);C.order.splice(p,0,it);drawSteps(L)}})}
function swap(L,a,b){if(b<0||b>=C.order.length)return;[C.order[a],C.order[b]]=[C.order[b],C.order[a]];drawSteps(L)}
function cek(L){
  const fb=$("fb");fb.hidden=false;
  if(IAMWOLF){fb.className="fb bad";fb.textContent="Kamu serigala dan sudah gugur: jawabanmu tidak dinilai.";return}
  let okQ=true;
  if(L.q){const sel=[...document.querySelectorAll("input[name=qq]:checked")].map(i=>+i.value);
    if(!sel.length){fb.className="fb bad";fb.textContent="Jawab pertanyaan di bawah langkah dulu.";return}
    okQ=sel.length===L.q.a.length&&L.q.a.every(a=>sel.includes(a))}
  const okO=C.order.every((v,i)=>v===i);
  if(okO&&okQ){stopAudio();
    const pts=Math.max(40,100-20*C.salah);S.skor+=pts;
    const sec=Math.round((Date.now()-C.t0)/1000);
    S.det=S.det||[];S.det[S.lv-1]={p:pts,s:C.salah,w:sec};S.waktu=(S.waktu||0)+sec;
    const from=av().e;
    if(S.lv===5)S.done=true;else S.lv++;
    save();recordRank();stats();pushProfile();DIRTY=true;
    $("panel").innerHTML=`<div class="center"><div class="big">${spr(from,72)} ➜ ${spr(av().e,72)}</div>
      <h2>Urutan benar! +${pts} poin</h2>
      <p class="lead" style="margin:0 auto">${S.done?"Kamu naik menjadi Raja Ternak dan meraih Lencana Emas!":`Pakan didapat. Kamu berubah menjadi ${av().n} dan boleh masuk ke tantangan Level ${S.lv}.`}</p>
      <button class="btn" id="lan">${S.done?"Lihat gelarku":"Lanjut berburu"}</button></div>`;
    $("panel").dataset.k="ok";$("lan").focus();
    $("lan").onclick=()=>{closeModal();S.done?winModal():toMap()};
    return}
  C.salah++;
  const bag=[!okO&&"urutan langkah",!okQ&&"jawaban pertanyaan"].filter(Boolean).join(" dan ");
  fb.className="fb bad";
  fb.textContent=`Pakan belum didapat: ${bag} masih kurang tepat. `+(L.hint?`Petunjuk: ${L.hint} Dengarkan lagi audionya di lobi.`:"Tidak ada petunjuk di level ini. Dengarkan lagi audionya di lobi.")}

/* ---------- Input ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("modal").hidden){const k=$("panel").dataset.k;if(k==="welcome")return;k==="ch"?closeCh():k==="ok"?$("lan").click():closeModal();return}
  if(e.target.tagName==="INPUT"||!S||!$("modal").hidden)return;
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){e.preventDefault();keys.add(k)}
  else if((k==="e"||k==="enter"||k===" ")&&e.target.tagName!=="BUTTON"){e.preventDefault();act()}});
document.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur",()=>{keys.clear();pad=[0,0];ptr=null});
(()=>{const base=$("dpad"),knob=$("knob");let pid_=null;
  const setK=(x,y)=>{knob.style.transform=`translate(${x}px,${y}px)`};
  const mv=e=>{const r=base.getBoundingClientRect(),R=r.width/2,max=R-28;
    let vx=e.clientX-(r.left+R),vy=e.clientY-(r.top+R);const l=Math.hypot(vx,vy);
    if(l>max){vx=vx/l*max;vy=vy/l*max}
    setK(vx,vy);const dz=.12;let ax=vx/max,ay=vy/max;
    pad=Math.hypot(ax,ay)<dz?[0,0]:[ax,ay]};
  const end=e=>{if(pid_!==e.pointerId)return;pid_=null;pad=[0,0];setK(0,0)};
  base.addEventListener("pointerdown",e=>{if(pid_!==null)return;e.preventDefault();pid_=e.pointerId;base.setPointerCapture(e.pointerId);mv(e)});
  base.addEventListener("pointermove",e=>{if(pid_===e.pointerId)mv(e)});
  ["pointerup","pointercancel","lostpointercapture"].forEach(v=>base.addEventListener(v,end));
  addEventListener("blur",()=>{pid_=null;pad=[0,0];setK(0,0)})})();
$("actBtn").onclick=act;
cv.addEventListener("pointerdown",e=>{ptr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.focus()});
cv.addEventListener("pointermove",e=>{if(ptr)ptr={x:e.clientX,y:e.clientY}});
["pointerup","pointercancel"].forEach(v=>cv.addEventListener(v,()=>{ptr=null}));
$("prof").onclick=()=>openProfile(false);
$("bRank").innerHTML=sp("🏆",26);$("bHelp").innerHTML=sp("❓",26);
$("bRank").onclick=()=>$("rkp").classList.toggle("off");
$("bHelp").onclick=openHelp;
$("rkAll").onclick=()=>openRank();
if(innerWidth<760)$("rkp").classList.add("off");

/* ---------- Mulai ---------- */
try{const h=decodeURIComponent((location.hash||"").slice(1)),k=cleanKelas(h)||cleanKelas(localStorage.getItem(CKEY));if(k)KELAS=k}catch(e){}
fit();useScene("lobi");me.x=240;me.y=274;startLoop();openProfile(true);
if("speechSynthesis" in window)speechSynthesis.getVoices();
</script>
